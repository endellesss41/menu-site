<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Menü</title>

<style>
body{
  font-family: Arial;
  background:#f5f5f5;
  margin:0;
  padding:20px;
}

h1{
  text-align:center;
}

.kategori{
  font-size:22px;
  font-weight:bold;
  margin-top:25px;
  color:#333;
}

.card{
  background:white;
  padding:12px;
  margin:10px 0;
  border-radius:10px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}
</style>
</head>

<body>

<h1>MENÜ</h1>
<div id="menu"></div>

<script>

const API_URL = "https://app.nocodb.com/api/v3/data/pkaijsm6lr42clm/mpdnw87dh3ym958/records";
const API_KEY = "BURAYA_YENI_TOKENINI_KOY";

fetch(API_URL, {
  method: "GET",
  headers: {
    "Authorization": "Bearer " + API_KEY,
    "Content-Type": "application/json"
  }
})
.then(res => {
  if(!res.ok){
    throw new Error("HTTP " + res.status);
  }
  return res.json();
})
.then(data => {

  console.log("API DATA:", data);

  const items = data.list || data.records || [];

  let html = "";
  let lastCategory = "";

  items.forEach(i => {

    const aktif = i.aktif ?? true;
    if(!aktif) return;

    const kategori = i.kategori || "Diğer";
    const urun = i.urun || "Ürün";
    const fiyat = i.fiyat || "-";

    if(kategori !== lastCategory){
      lastCategory = kategori;
      html += `<div class="kategori">${kategori}</div>`;
    }

    html += `
      <div class="card">
        <b>${urun}</b><br>
        ${fiyat} ₺
      </div>
    `;
  });

  document.getElementById("menu").innerHTML = html;

})
.catch(err => {
  console.error(err);
  document.getElementById("menu").innerHTML =
    "<h3 style='color:red'>Veri yüklenemedi</h3>";
});

</script>

</body>
</html>
