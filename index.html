<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Menü</title>

<style>
body{
  font-family: Arial;
  background:#f5f5f5;
  margin:0;
  padding:20px;
}

h1{
  text-align:center;
}

.kategori{
  font-size:22px;
  font-weight:bold;
  margin-top:25px;
  color:#222;
}

.card{
  background:white;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}
</style>
</head>

<body>

<h1>MENÜ</h1>
<div id="menu">Yükleniyor...</div>

<script>

// 🔥 1. DOĞRU API (v2 kullanıyoruz)
const API_URL = "https://app.nocodb.com/api/v2/tables/mpdnw87dh3ym958/records";

// 🔥 2. TOKEN (BURAYA KENDİ TOKENİNİ KOY)
const API_KEY = "nc_pat_A7FGzt8laXsSf19184lxSpqn9yh59NY1eAuvTliA";

fetch(API_URL, {
  method: "GET",
  headers: {
    "xc-token": API_KEY,
    "Content-Type": "application/json"
  }
})
.then(res => {

  console.log("STATUS:", res.status);

  if(!res.ok){
    throw new Error("HTTP " + res.status);
  }

  return res.json();
})
.then(data => {

  console.log("API DATA:", data);

  // 🔥 NocoDB structure fix
  const items = data.records || [];

  let html = "";
  let lastCat = "";

  items.forEach(row => {

    const f = row.fields || {};

    const aktif = f.aktif ?? true;
    if(aktif === false) return;

    const kategori = f.kategori || "Diğer";
    const urun = f.urun || "Ürün";
    const fiyat = f.fiyat || "-";

    if(kategori !== lastCat){
      lastCat = kategori;
      html += `<div class="kategori">${kategori}</div>`;
    }

    html += `
      <div class="card">
        <b>${urun}</b><br>
        ${fiyat} ₺
      </div>
    `;
  });

  document.getElementById("menu").innerHTML = html || "Veri yok";

})
.catch(err => {
  console.error(err);
  document.getElementById("menu").innerHTML =
    "<h3 style='color:red'>Veri yüklenemedi: " + err.message + "</h3>";
});

</script>

</body>
</html>
