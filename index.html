<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Menü</title>
<style>
body { font-family: Arial; background:#f5f5f5; }
.card { background:white; padding:15px; margin:10px; border-radius:10px; }
.kategori { font-size:20px; font-weight:bold; margin-top:20px; }
</style>
</head>

<body>

<h1>MENÜ</h1>
<div id="menu"></div>

<script>
const API_URL = "BURAYA_NOCODB_API";
const API_KEY = "BURAYA_API_KEY";

fetch(API_URL, {
  headers: {
    "xc-token": API_KEY
  }
})
.then(res => res.json())
.then(data => {
  const items = data.list;
  let html = "";

  let currentCat = "";

  items.forEach(i => {
    if(i.aktif !== true) return;

    if(i.kategori !== currentCat){
      currentCat = i.kategori;
      html += `<div class="kategori">${currentCat}</div>`;
    }

    html += `
      <div class="card">
        <b>${i.urun}</b><br>
        ${i.fiyat}
      </div>
    `;
  });

  document.getElementById("menu").innerHTML = html;
});
</script>

</body>
</html>
