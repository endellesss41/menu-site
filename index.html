<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Menü</title>

<style>
body{font-family:Arial;background:#f5f5f5;padding:20px;}
.kategori{font-size:22px;font-weight:bold;margin-top:20px;}
.card{background:white;padding:10px;margin:8px 0;border-radius:8px;}
</style>
</head>

<body>

<h1>MENÜ</h1>
<div id="menu">Yükleniyor...</div>

<script>

const API_URL = "https://app.nocodb.com/api/v2/tables/mpdnw87dh3ym958/records";

fetch(API_URL)
.then(res => {
  if(!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
})
.then(data => {

  const items = data.records || [];

  let html = "";
  let lastCat = "";

  items.forEach(row => {

    const f = row.fields || {};

    if(f.aktif === false) return;

    if(f.kategori !== lastCat){
      lastCat = f.kategori;
      html += `<div class="kategori">${lastCat}</div>`;
    }

    html += `
      <div class="card">
        <b>${f.urun}</b><br>
        ${f.fiyat} ₺
      </div>
    `;
  });

  document.getElementById("menu").innerHTML = html;

})
.catch(err => {
  document.getElementById("menu").innerHTML = "HATA: " + err.message;
});

</script>

</body>
</html>
